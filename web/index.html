<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="성경 읽기를 3D 블록으로 시각화하는 동기부여 앱 — 1,189장을 읽을 때마다 나만의 성경책이 완성됩니다.">
  <meta name="theme-color" content="#0a0a1a">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="바이블블록 — 성경 읽기 시각화">
  <meta property="og:description" content="성경 1,189장을 읽을 때마다 3D 블록이 채워집니다. 함께 성경읽기를 시작해요.">
  <meta property="og:image" content="https://bible-blocks-omega.vercel.app/share_card.png">
  <meta property="og:url" content="https://bible-blocks-omega.vercel.app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="바이블블록">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>바이블블록</title>
  <link rel="manifest" href="manifest.json">

  <!-- Kakao JS SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
  <script>
    Kakao.init('5cf3f493b53a15dca87ca6e0bf9884c1');

    // 정적 이미지 카카오톡 공유
    function _kakaoShareSendDefault(nickname, percent, totalRead, totalChapters, imageUrl, webUrl) {
      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: {
          title: '(바이블블록) 함께 성경읽기를 시작해요.',
          description: nickname + '의 진척도: ' + percent + '% (' + totalRead + '/' + totalChapters + '장)',
          imageUrl: imageUrl,
          link: { webUrl: webUrl, mobileWebUrl: webUrl },
        },
        buttons: [
          {
            title: '바이블블록 시작하기',
            link: { webUrl: webUrl, mobileWebUrl: webUrl },
          },
        ],
      });
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
